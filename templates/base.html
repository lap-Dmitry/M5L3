<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Matplotlib and Cartropy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/css/style.css') }}">
  </head>
  <body>
    <h1>Карта городов</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <nav>
      <a href="{{ url_for('index') }}">Список городов</a> |
      <a href="{{ url_for('map_page') }}">Карта и расстояния</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
  </body>
</html>
